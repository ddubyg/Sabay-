{% comment %}
Shared top navigation. Pass `active` = home | profile | friends | settings.
{% endcomment %}
<nav class="navbar">

    <a href="{% url 'home' %}" class="brand">
        <div class="brand-icon">
            <span>S</span>
        </div>
        <div class="brand-name">
            Sabay?
        </div>
    </a>

    <div class="nav-links">
        <a href="{% url 'home' %}"{% if active == 'home' %} class="active"{% endif %}>Home</a>
        <a href="{% url 'whos_going' %}"{% if active == 'whos_going' %} class="active"{% endif %}>Who's Going</a>
        <a href="{% url 'needs_people' %}"{% if active == 'needs_people' %} class="active"{% endif %}>Needs People</a>
        <a href="{% url 'friends' %}"{% if active == 'friends' %} class="active"{% endif %}>
            Friends{% if pending_friend_requests %}<span class="nav-badge" title="{{ pending_friend_requests }} friend request{{ pending_friend_requests|pluralize }}">{{ pending_friend_requests }}</span>{% endif %}
        </a>
        <a href="{% url 'profile' %}"{% if active == 'profile' %} class="active"{% endif %}>Profile</a>
        <a href="{% url 'settings' %}"{% if active == 'settings' %} class="active"{% endif %}>Settings</a>
        <a href="{% url 'logout' %}" class="logout">Logout</a>
    </div>

</nav>
